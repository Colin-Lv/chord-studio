<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>整曲重构 · Chord Studio</title><link rel="stylesheet" href="/assets/reconstruction.css"><link rel="stylesheet" href="/assets/task-queue.css"><script defer src="/assets/task-queue.js"></script>
</head>
<body><header><a href="/">← 和声工作台</a><a id="pianoLink" href="/piano">钢琴扒谱</a><a id="stemsLink" href="/stems">音轨分离</a><span>CHORD STUDIO</span></header>
<main><section class="intro"><p class="eyebrow">音频 → 演奏 → 可编辑工程</p><h1>整曲重构</h1><p>把原曲分成声部，转写音符，再用乐器重放。原分轨和 MIDI 始终可以逐轨对照。</p></section>
<section class="card setup"><label>歌曲<select id="project" aria-label="歌曲"></select></label><label class="upload">上传原曲<input id="upload" type="file" accept="audio/*"></label><label class="check"><input id="comparison" type="checkbox" checked>同时生成原曲多乐器模型对照</label><button id="generate">生成整曲重构</button><p id="status" role="status">正在读取歌曲…</p><p id="error" role="alert" hidden></p></section>
<section id="result" hidden><div class="headline"><div><h2 id="title">重构结果</h2><p id="summary"></p></div><div class="downloads"><a id="midi" download>默认组合 MIDI ↓</a><a id="bundle" download>完整工程包 ↓</a><a id="candidate" download hidden>原曲模型 MIDI 对照 ↓</a></div></div>
<section class="card transport"><div class="playrow"><button id="play">播放</button><button id="back">回到开头</button><span id="time">00:00 / 00:00</span><label>试听方式<select id="mode"><option value="hybrid">混合重放：按已纳入声部组合 MIDI 与音频</option><option value="midi">纯 MIDI：所有声部用乐器重放</option><option value="source">分轨合奏：全部使用分离音频</option><option value="original">原曲</option><option id="candidateMode" value="candidate" disabled>原曲 → 多乐器模型 MIDI 对照</option><option value="custom">自选声部</option></select></label></div><input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="播放位置"><p id="listenNote">混合重放含原分轨；选择纯 MIDI 可听到实际转写效果。</p><p id="loading" role="status"></p></section>
<div id="tracks" class="tracks"></div>
<section class="card"><div class="rollhead"><h2>音符与小节</h2><select id="rollTrack" aria-label="查看声部"></select><button id="previous">←</button><span id="windowLabel"></span><button id="next">→</button><label class="check"><input id="follow" type="checkbox" checked>跟随播放</label></div><canvas id="roll" width="1200" height="390" aria-label="声部音符图，点击试听对应位置"></canvas><p id="harmony"></p><p id="noteDetail">点击音符查看音高、力度、时间与拍点位置。下载 MIDI 后可在音乐软件中编辑。</p></section>
<section class="card"><h2>本次结果的范围</h2><ul id="limitations"></ul><p id="warnings"></p><a id="manifest">查看来源与验证记录</a></section></section></main>
<script src="/assets/stem-audio.js"></script><script src="/assets/reconstruction.js"></script></body></html>
