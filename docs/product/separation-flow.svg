<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><style>text{font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;fill:#211e19}.muted{fill:#797369}.white{fill:#fff}.small{font-size:21px}.body{font-size:26px}.heading{font-size:34px;font-weight:700}</style>
